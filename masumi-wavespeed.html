<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ますみのこえ2">
<title>ますみのこえ2 🌸</title>
<style>
  :root {
    --pink: #E85555;
    --pink-light: #FFE8E8;
    --pink-mid: #F9A8A8;
    --white: #FFFFFF;
    --gray: #666;
    --shadow: 0 2px 12px rgba(232,85,85,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; background: var(--pink-light); color: #333; max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  /* ヘッダー */
  .header { background: var(--pink); color: white; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header-badge { background: rgba(255,255,255,0.25); border-radius: 20px; padding: 4px 10px; font-size: 11px; }
  .settings-btn { background: rgba(255,255,255,0.2); border: none; color: white; border-radius: 8px; padding: 6px 10px; font-size: 16px; cursor: pointer; }

  /* タブ */
  .tabs { display: flex; background: white; border-bottom: 2px solid var(--pink-light); position: sticky; top: 52px; z-index: 99; }
  .tab { flex: 1; padding: 10px 4px; text-align: center; font-size: 11px; color: var(--gray); cursor: pointer; border: none; background: none; transition: all 0.2s; }
  .tab.active { color: var(--pink); border-bottom: 2px solid var(--pink); margin-bottom: -2px; font-weight: 700; }
  .tab-icon { display: block; font-size: 20px; margin-bottom: 2px; }

  /* コンテンツ */
  .content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 80px; }
  .page { display: none; }
  .page.active { display: block; }

  /* ホームページ */
  .phrase-categories { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .phrase-cat { background: white; border-radius: 14px; padding: 14px; cursor: pointer; box-shadow: var(--shadow); transition: transform 0.15s; text-align: center; border: 2px solid transparent; }
  .phrase-cat:active { transform: scale(0.97); }
  .phrase-cat-icon { font-size: 28px; display: block; margin-bottom: 6px; }
  .phrase-cat-name { font-size: 12px; font-weight: 600; color: #444; }
  .phrase-cat-count { font-size: 10px; color: var(--gray); margin-top: 2px; }

  /* フレーズモーダル */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; justify-content: flex-end; flex-direction: column; }
  .modal-overlay.open { display: flex; }
  .modal { background: white; border-radius: 20px 20px 0 0; max-height: 70vh; overflow-y: auto; padding: 20px; }
  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 14px; color: var(--pink); }
  .phrase-item { padding: 12px 14px; margin-bottom: 8px; background: var(--pink-light); border-radius: 10px; cursor: pointer; font-size: 14px; transition: background 0.15s; display: flex; align-items: center; gap: 8px; }
  .phrase-item:active { background: var(--pink-mid); }
  .modal-close { width: 100%; padding: 12px; background: #eee; border: none; border-radius: 10px; margin-top: 10px; font-size: 14px; cursor: pointer; }

  /* TTSページ */
  .tts-area { background: white; border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
  .tts-textarea { width: 100%; min-height: 100px; border: 2px solid var(--pink-light); border-radius: 10px; padding: 12px; font-size: 16px; font-family: inherit; resize: none; outline: none; transition: border-color 0.2s; }
  .tts-textarea:focus { border-color: var(--pink); }
  .char-count { text-align: right; font-size: 11px; color: var(--gray); margin-top: 4px; }
  .speed-control { margin: 12px 0; }
  .speed-label { font-size: 12px; color: var(--gray); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .speed-slider { width: 100%; accent-color: var(--pink); }
  .speak-btn { width: 100%; padding: 16px; background: var(--pink); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer; margin-top: 12px; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .speak-btn:disabled { opacity: 0.6; }
  .history-section { margin-top: 16px; }
  .history-title { font-size: 13px; color: var(--gray); margin-bottom: 8px; font-weight: 600; }
  .history-item { padding: 10px 12px; background: white; border-radius: 8px; margin-bottom: 6px; font-size: 13px; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; justify-content: space-between; align-items: center; }
  .history-item:active { background: var(--pink-light); }

  /* 筆談ページ */
  .whiteboard-wrap { background: white; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
  #canvas { display: block; width: 100%; touch-action: none; cursor: crosshair; }
  .wb-controls { padding: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .wb-colors { display: flex; gap: 6px; }
  .wb-color { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: border-color 0.15s; }
  .wb-color.active { border-color: #333; }
  .wb-sizes { display: flex; gap: 6px; }
  .wb-size { width: 28px; height: 28px; background: #eee; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; border: 2px solid transparent; }
  .wb-size.active { border-color: var(--pink); background: var(--pink-light); }
  .wb-btn { padding: 6px 12px; background: #eee; border: none; border-radius: 8px; font-size: 12px; cursor: pointer; }
  .wb-btn.danger { background: #FFE0E0; color: #c00; }

  /* リアクションページ */
  .reactions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .reaction-btn { background: white; border: none; border-radius: 14px; padding: 16px 8px; cursor: pointer; box-shadow: var(--shadow); transition: transform 0.15s; text-align: center; }
  .reaction-btn:active { transform: scale(0.95); }
  .reaction-emoji { font-size: 36px; display: block; margin-bottom: 6px; }
  .reaction-label { font-size: 11px; color: #555; }

  /* 設定モーダル */
  .settings-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; align-items: center; justify-content: center; padding: 20px; }
  .settings-modal.open { display: flex; }
  .settings-box { background: white; border-radius: 20px; padding: 24px; width: 100%; max-width: 380px; }
  .settings-box h2 { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: var(--pink); }
  .settings-label { font-size: 12px; color: var(--gray); margin-bottom: 6px; font-weight: 600; }
  .settings-input { width: 100%; padding: 10px 12px; border: 2px solid #eee; border-radius: 10px; font-size: 13px; font-family: monospace; margin-bottom: 12px; outline: none; }
  .settings-input:focus { border-color: var(--pink); }
  .settings-save { width: 100%; padding: 12px; background: var(--pink); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }

  /* ステータス */
  .status-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: white; border-top: 1px solid #eee; padding: 8px 16px; font-size: 12px; color: var(--gray); text-align: center; z-index: 98; }
  .status-bar.speaking { color: var(--pink); font-weight: 600; }

  /* トースト */
  .toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 400; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ヘッダー -->
<div class="header">
  <h1>ますみのこえ 🌸 <span class="header-badge">WaveSpeed版</span></h1>
  <button class="settings-btn" onclick="openSettings()">⚙️</button>
</div>

<!-- タブ -->
<div class="tabs">
  <button class="tab active" onclick="showTab('home',this)">
    <span class="tab-icon">🏠</span>ホーム
  </button>
  <button class="tab" onclick="showTab('tts',this)">
    <span class="tab-icon">🎙️</span>読み上げ
  </button>
  <button class="tab" onclick="showTab('whiteboard',this)">
    <span class="tab-icon">🖊️</span>筆談
  </button>
  <button class="tab" onclick="showTab('reactions',this)">
    <span class="tab-icon">💬</span>リアクション
  </button>
</div>

<!-- コンテンツ -->
<div class="content">

  <!-- ホームページ -->
  <div id="page-home" class="page active">
    <div class="phrase-categories" id="phrase-cats"></div>
  </div>

  <!-- TTSページ -->
  <div id="page-tts" class="page">
    <div class="tts-area">
      <textarea class="tts-textarea" id="tts-input" placeholder="話したい言葉を入力してください..." oninput="updateCount()"></textarea>
      <div class="char-count"><span id="char-count">0</span> 文字</div>
      <div class="speed-control">
        <div class="speed-label">
          <span>🎚️ 話す速さ</span>
          <span id="speed-val">標準 (1.0×)</span>
        </div>
        <input type="range" class="speed-slider" id="speed-slider" min="0.5" max="2.0" step="0.1" value="1.0" oninput="updateSpeed()">
      </div>
      <button class="speak-btn" id="speak-btn" onclick="speakText()">
        🌸 話す
      </button>
    </div>
    <div class="history-section">
      <div class="history-title">🕐 最近話した言葉</div>
      <div id="history-list"><div style="color:#aaa;font-size:13px;padding:8px">まだ履歴がありません</div></div>
    </div>
  </div>

  <!-- 筆談ページ -->
  <div id="page-whiteboard" class="page">
    <div class="whiteboard-wrap">
      <canvas id="canvas"></canvas>
      <div class="wb-controls">
        <div class="wb-colors">
          <div class="wb-color active" style="background:#333" data-color="#333" onclick="setColor(this)"></div>
          <div class="wb-color" style="background:#E85555" data-color="#E85555" onclick="setColor(this)"></div>
          <div class="wb-color" style="background:#4A90E2" data-color="#4A90E2" onclick="setColor(this)"></div>
          <div class="wb-color" style="background:#27AE60" data-color="#27AE60" onclick="setColor(this)"></div>
          <div class="wb-color" style="background:#F39C12" data-color="#F39C12" onclick="setColor(this)"></div>
        </div>
        <div class="wb-sizes">
          <div class="wb-size" data-size="3" onclick="setSize(this)">S</div>
          <div class="wb-size active" data-size="6" onclick="setSize(this)">M</div>
          <div class="wb-size" data-size="12" onclick="setSize(this)">L</div>
        </div>
        <button class="wb-btn danger" onclick="clearCanvas()">🗑️ 消す</button>
      </div>
    </div>
  </div>

  <!-- リアクションページ -->
  <div id="page-reactions" class="page">
    <div class="reactions-grid" id="reactions-grid"></div>
  </div>

</div>

<!-- フレーズモーダル -->
<div class="modal-overlay" id="phrase-modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-phrases"></div>
    <button class="modal-close" onclick="closePhraseModal()">閉じる</button>
  </div>
</div>

<!-- 設定モーダル -->
<div class="settings-modal" id="settings-modal">
  <div class="settings-box">
    <h2>⚙️ 設定</h2>
    <div class="settings-label">WaveSpeed APIキー</div>
    <input type="password" class="settings-input" id="api-key-input" placeholder="sk-...">
    <div class="settings-label">Voice ID</div>
    <input type="text" class="settings-input" id="voice-id-input" value="Masumi-001">
    <button class="settings-save" onclick="saveSettings()">💾 保存</button>
    <button class="modal-close" style="margin-top:8px" onclick="closeSettings()">キャンセル</button>
  </div>
</div>

<!-- ステータスバー -->
<div class="status-bar" id="status-bar">ELで話してください</div>

<!-- トースト -->
<div class="toast" id="toast"></div>

<script>
// ===== データ =====
const PHRASES = {
  '⭐ 基本フレーズ': ['ありがとう 💕', 'ごめんなさい', 'はい', 'いいえ', 'もう一度お願い', 'わかった', 'わからない', '大丈夫だよ', 'うれしい！', 'ちょっと待って'],
  '🌞 日常会話': ['おはよう☀️', 'おやすみ🌙', 'いってきます', 'ただいま', 'お腹すいた', 'のどが渇いた', '眠い', '疲れた', '元気だよ', '今日もよろしく'],
  '🏥 からだ・病院': ['痛い', 'ここが痛い', '気持ち悪い', '熱がある', '薬をください', 'トイレに行きたい', '休みたい', '息苦しい', '大丈夫じゃない', 'ゆっくり話して'],
  '🛍️ 旅行・買い物': ['これをください', 'いくらですか？', 'クレジットカードは使えますか？', 'どこですか？', 'ありがとうございました', 'もう少し安くなりますか？', '試着したい', '写真撮ってもいいですか？'],
  '💝 こーちゃん': ['愛してるよ 💕', 'そばにいてね', 'ありがとう、いつも', '手を握って', '声が聞きたかった', 'あなたがいれば大丈夫', 'いっしょにいよう', 'ずっと好きだよ 🌸'],
  '🚃 交通機関': ['〇〇駅はどこですか？', '次は何駅ですか？', '乗り換えはありますか？', 'タクシーを呼んでください', 'ここで降ります', 'どのくらい時間がかかりますか？'],
};

const REACTIONS = [
  { emoji: '😊', label: 'うれしい' },
  { emoji: '😢', label: 'かなしい' },
  { emoji: '😂', label: 'おかしい' },
  { emoji: '😍', label: '大好き' },
  { emoji: '😴', label: 'ねむい' },
  { emoji: '😤', label: 'いやだ' },
  { emoji: '🥰', label: 'ありがとう' },
  { emoji: '😣', label: 'つらい' },
  { emoji: '🤔', label: 'わからない' },
  { emoji: '👍', label: 'いいよ' },
  { emoji: '👋', label: 'またね' },
  { emoji: '🆘', label: '助けて' },
];

// ===== 設定 =====
let API_KEY = localStorage.getItem('ws_api_key') || '';
let VOICE_ID = localStorage.getItem('ws_voice_id') || 'Masumi-001';
let history = JSON.parse(localStorage.getItem('ws_history') || '[]');
let speechRate = 1.0;

// ===== 初期化 =====
function init() {
  buildPhraseCategories();
  buildReactions();
  initCanvas();
  renderHistory();
  updateStatus('準備完了 🌸');
  if (!API_KEY) {
    setTimeout(() => showToast('⚙️ 設定からAPIキーを入力してください'), 800);
  }
}

// ===== フレーズカテゴリ =====
function buildPhraseCategories() {
  const grid = document.getElementById('phrase-cats');
  Object.entries(PHRASES).forEach(([cat, phrases]) => {
    const parts = cat.split(' ');
    const icon = parts[0];
    const name = parts.slice(1).join(' ');
    const div = document.createElement('div');
    div.className = 'phrase-cat';
    div.innerHTML = `<span class="phrase-cat-icon">${icon}</span><div class="phrase-cat-name">${name}</div><div class="phrase-cat-count">${phrases.length}フレーズ</div>`;
    div.onclick = () => openPhraseModal(cat, phrases);
    grid.appendChild(div);
  });
}

// ===== フレーズモーダル =====
function openPhraseModal(cat, phrases) {
  document.getElementById('modal-title').textContent = cat;
  const container = document.getElementById('modal-phrases');
  container.innerHTML = '';
  phrases.forEach(p => {
    const div = document.createElement('div');
    div.className = 'phrase-item';
    div.innerHTML = `<span>🔊</span><span>${p}</span>`;
    div.onclick = () => { speakPhrase(p); closePhraseModal(); };
    container.appendChild(div);
  });
  document.getElementById('phrase-modal').classList.add('open');
}

function closePhraseModal() {
  document.getElementById('phrase-modal').classList.remove('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('phrase-modal')) closePhraseModal();
}

// ===== リアクション =====
function buildReactions() {
  const grid = document.getElementById('reactions-grid');
  REACTIONS.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'reaction-btn';
    btn.innerHTML = `<span class="reaction-emoji">${r.emoji}</span><span class="reaction-label">${r.label}</span>`;
    btn.onclick = () => speakPhrase(r.label);
    grid.appendChild(btn);
  });
}

// ===== TTS =====
async function speakText() {
  const text = document.getElementById('tts-input').value.trim();
  if (!text) { showToast('テキストを入力してください'); return; }
  await doSpeak(text);
}

async function speakPhrase(text) {
  await doSpeak(text);
}

async function doSpeak(text) {
  if (!API_KEY) { openSettings(); showToast('⚙️ APIキーを設定してください'); return; }

  const btn = document.getElementById('speak-btn');
  if (btn) btn.disabled = true;
  updateStatus('🎙️ 生成中...', true);

  try {
    // WaveSpeedAI APIに送信
    const submitRes = await fetch('https://api.wavespeed.ai/api/v3/minimax/speech-02-hd', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${API_KEY}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        text: text,
        voice_id: VOICE_ID,
        speed: speechRate
      })
    });

    if (!submitRes.ok) throw new Error(`API error: ${submitRes.status}`);
    const submitData = await submitRes.json();
    const predId = submitData.data?.id;
    if (!predId) throw new Error('prediction IDが取得できません');

    // 結果をポーリング
    let audioUrl = null;
    for (let i = 0; i < 30; i++) {
      await sleep(1000);
      updateStatus(`🎙️ 処理中... (${i+1}秒)`, true);
      const resRes = await fetch(`https://api.wavespeed.ai/api/v3/predictions/${predId}/result`, {
        headers: { 'Authorization': `Bearer ${API_KEY}` }
      });
      const resData = await resRes.json();
      const status = resData.data?.status;
      if (status === 'completed') {
        audioUrl = resData.data?.outputs?.[0];
        break;
      }
      if (status === 'failed') throw new Error('生成に失敗しました');
    }

    if (!audioUrl) throw new Error('タイムアウトしました');

    // 再生
    updateStatus('🔊 再生中...', true);
    const audio = new Audio(audioUrl);
    audio.onended = () => updateStatus('準備完了 🌸');
    audio.play();

    // 履歴に追加
    addHistory(text);

  } catch (err) {
    console.error(err);
    showToast('❌ エラー: ' + err.message);
    updateStatus('エラーが発生しました');
  } finally {
    if (btn) btn.disabled = false;
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ===== 履歴 =====
function addHistory(text) {
  history = [text, ...history.filter(h => h !== text)].slice(0, 10);
  localStorage.setItem('ws_history', JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (!list) return;
  if (history.length === 0) {
    list.innerHTML = '<div style="color:#aaa;font-size:13px;padding:8px">まだ履歴がありません</div>';
    return;
  }
  list.innerHTML = history.map(h =>
    `<div class="history-item" onclick="speakPhrase('${h.replace(/'/g,"\\'")}')"><span>${h}</span><span style="color:#aaa">🔊</span></div>`
  ).join('');
}

// ===== 文字数 / スピード =====
function updateCount() {
  const v = document.getElementById('tts-input').value.length;
  document.getElementById('char-count').textContent = v;
}

function updateSpeed() {
  speechRate = parseFloat(document.getElementById('speed-slider').value);
  const labels = { 0.5:'ゆっくり (0.5×)', 0.75:'少しゆっくり (0.75×)', 1.0:'標準 (1.0×)', 1.25:'少し速め (1.25×)', 1.5:'速め (1.5×)', 2.0:'とても速い (2.0×)' };
  document.getElementById('speed-val').textContent = labels[speechRate] || `${speechRate}×`;
}

// ===== タブ =====
function showTab(name, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  el.classList.add('active');
}

// ===== ステータス =====
function updateStatus(msg, speaking=false) {
  const bar = document.getElementById('status-bar');
  bar.textContent = msg;
  bar.className = 'status-bar' + (speaking ? ' speaking' : '');
}

// ===== トースト =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== 設定 =====
function openSettings() {
  document.getElementById('api-key-input').value = API_KEY;
  document.getElementById('voice-id-input').value = VOICE_ID;
  document.getElementById('settings-modal').classList.add('open');
}

function closeSettings() {
  document.getElementById('settings-modal').classList.remove('open');
}

function saveSettings() {
  API_KEY = document.getElementById('api-key-input').value.trim();
  VOICE_ID = document.getElementById('voice-id-input').value.trim() || 'Masumi-001';
  localStorage.setItem('ws_api_key', API_KEY);
  localStorage.setItem('ws_voice_id', VOICE_ID);
  closeSettings();
  showToast('✅ 設定を保存しました');
}

// ===== 筆談ボード =====
function initCanvas() {
  const canvas = document.getElementById('canvas');
  const wrap = canvas.parentElement;
  canvas.width = wrap.offsetWidth || 340;
  canvas.height = 280;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let drawing = false;
  let color = '#333';
  let size = 6;

  window.setColor = (el) => {
    color = el.dataset.color;
    document.querySelectorAll('.wb-color').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
  };
  window.setSize = (el) => {
    size = parseInt(el.dataset.size);
    document.querySelectorAll('.wb-size').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
  };
  window.clearCanvas = () => {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  };

  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - r.left) * (canvas.width / r.width), y: (src.clientY - r.top) * (canvas.height / r.height) };
  }

  function start(e) { e.preventDefault(); drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
  function move(e) { if (!drawing) return; e.preventDefault(); const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.strokeStyle = color; ctx.lineWidth = size; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); }
  function end() { drawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);
}

// ===== 起動 =====
init();
</script>
</body>
</html>
