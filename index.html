
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ますみのこえ">
<meta name="theme-color" content="#E85555">
<title>ますみのこえ</title>
<style>
:root{--pink:#E85555;--pink-light:#FFE8E8;--pink-mid:#F9A8A8;--white:#FFFFFF;--gray:#666;--shadow:0 2px 12px rgba(232,85,85,0.15)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;background:var(--pink-light);color:#333;max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
/* ヘッダー */
.header{background:var(--pink);color:white;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);position:sticky;top:0;z-index:100}
.header h1{font-size:18px;font-weight:700}
.header-right{display:flex;align-items:center;gap:8px}
.status-indicator{width:10px;height:10px;border-radius:50%;background:#4ade80;box-shadow:0 0 6px #4ade80}
.status-indicator.loading{background:#fbbf24;animation:blink 0.8s infinite}
.status-indicator.error{background:#f87171}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
/* タブ */
.tabs{display:flex;background:white;border-bottom:2px solid var(--pink-light);position:sticky;top:52px;z-index:99}
.tab{flex:1;padding:10px 4px;text-align:center;font-size:11px;color:var(--gray);cursor:pointer;border:none;background:none;transition:all 0.2s}
.tab.active{color:var(--pink);border-bottom:2px solid var(--pink);margin-bottom:-2px;font-weight:700}
.tab-icon{display:block;font-size:20px;margin-bottom:2px}
/* コンテンツ */
.content{flex:1;overflow-y:auto;padding:16px;padding-bottom:80px}
.page{display:none}.page.active{display:block}
/* ホーム */
.phrase-categories{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phrase-cat{background:white;border-radius:14px;padding:14px;cursor:pointer;box-shadow:var(--shadow);text-align:center;border:none;transition:transform 0.15s}
.phrase-cat:active{transform:scale(0.97)}
.phrase-cat-icon{font-size:28px;display:block;margin-bottom:6px}
.phrase-cat-name{font-size:12px;font-weight:600;color:#444}
.phrase-cat-count{font-size:10px;color:var(--gray);margin-top:2px}
/* モーダル */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;justify-content:flex-end;flex-direction:column}
.modal-overlay.open{display:flex}
.modal{background:white;border-radius:20px 20px 0 0;max-height:70vh;overflow-y:auto;padding:20px}
.modal-title{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--pink)}
.phrase-item{padding:12px 14px;margin-bottom:8px;background:var(--pink-light);border-radius:10px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:8px;transition:background 0.15s}
.phrase-item:active{background:var(--pink-mid)}
.modal-close{width:100%;padding:12px;background:#eee;border:none;border-radius:10px;margin-top:10px;font-size:14px;cursor:pointer}
/* TTS */
.tts-area{background:white;border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.tts-textarea{width:100%;min-height:100px;border:2px solid var(--pink-light);border-radius:10px;padding:12px;font-size:16px;font-family:inherit;resize:none;outline:none;transition:border-color 0.2s}
.tts-textarea:focus{border-color:var(--pink)}
.char-count{text-align:right;font-size:11px;color:var(--gray);margin-top:4px}
.speed-control{margin:12px 0}
.speed-label{font-size:12px;color:var(--gray);margin-bottom:6px;display:flex;justify-content:space-between}
.speed-slider{width:100%;accent-color:var(--pink)}
/* 話すボタン */
.speak-btn{width:100%;padding:16px;background:var(--pink);color:white;border:none;border-radius:12px;font-size:18px;font-weight:700;cursor:pointer;margin-top:12px;transition:all 0.2s;position:relative;display:flex;align-items:center;justify-content:center;gap:10px}
.speak-btn:disabled{opacity:0.6;cursor:not-allowed}
.speak-btn.loading{background:#f59e0b}
.speak-btn.success{background:#10b981}
.speak-btn.error-state{background:#ef4444}
/* ローディングスピナー */
.spinner{width:20px;height:20px;border:3px solid rgba(255,255,255,0.3);border-top:3px solid white;border-radius:50%;animation:spin 0.8s linear infinite;display:none}
.spinner.show{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
/* エラーメッセージ */
.error-msg{background:#FEE2E2;border:1px solid #FCA5A5;border-radius:10px;padding:12px;margin-top:10px;font-size:13px;color:#991B1B;display:none}
.error-msg.show{display:block}
.error-msg-title{font-weight:700;margin-bottom:4px}
.retry-btn{background:#ef4444;color:white;border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;margin-top:8px}
/* 成功トースト */
.success-toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#10b981;color:white;padding:10px 20px;border-radius:20px;font-size:13px;z-index:400;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap}
.success-toast.show{opacity:1}
/* 進捗表示 */
.progress-bar{height:4px;background:var(--pink-light);border-radius:2px;overflow:hidden;margin-top:8px;display:none}
.progress-bar.show{display:block}
.progress-fill{height:100%;background:var(--pink);width:0%;transition:width 0.3s;border-radius:2px}
/* 履歴 */
.history-section{margin-top:16px}
.section-title{font-size:13px;color:var(--gray);margin-bottom:8px;font-weight:600}
.history-item{padding:10px 12px;background:white;border-radius:8px;margin-bottom:6px;font-size:13px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,0.08);display:flex;justify-content:space-between;align-items:center;transition:background 0.15s}
.history-item:active{background:var(--pink-light)}
/* 筆談ボード */
.whiteboard-wrap{background:white;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
#canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
.wb-controls{padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wb-colors{display:flex;gap:6px}
.wb-color{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color 0.15s}
.wb-color.active{border-color:#333}
.wb-sizes{display:flex;gap:6px}
.wb-size{width:28px;height:28px;background:#eee;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;border:2px solid transparent}
.wb-size.active{border-color:var(--pink);background:var(--pink-light)}
.wb-btn{padding:6px 12px;background:#eee;border:none;border-radius:8px;font-size:12px;cursor:pointer}
/* リアクション */
.reactions-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.reaction-btn{background:white;border:none;border-radius:14px;padding:16px 8px;cursor:pointer;box-shadow:var(--shadow);transition:transform 0.15s;text-align:center}
.reaction-btn:active{transform:scale(0.95)}
.reaction-emoji{font-size:36px;display:block;margin-bottom:6px}
.reaction-label{font-size:11px;color:#555}
/* ネットワーク警告 */
.network-warning{background:#FEF3C7;border:1px solid #F59E0B;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:#92400E;display:none}
.network-warning.show{display:block}
/* ステータスバー */
.status-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:white;border-top:1px solid #eee;padding:8px 16px;font-size:12px;color:var(--gray);text-align:center;z-index:98;transition:color 0.3s}
.status-bar.speaking{color:var(--pink);font-weight:600}
.status-bar.err{color:#ef4444;font-weight:600}
/* トースト */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:10px 20px;border-radius:20px;font-size:13px;z-index:400;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="header">
  <h1>ますみのこえ 🌸</h1>
  <div class="header-right">
    <div class="status-indicator" id="status-dot"></div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('home',this)"><span class="tab-icon">🏠</span>ホーム</button>
  <button class="tab" onclick="showTab('tts',this)"><span class="tab-icon">🎙️</span>読み上げ</button>
  <button class="tab" onclick="showTab('whiteboard',this)"><span class="tab-icon">🖊️</span>筆談</button>
  <button class="tab" onclick="showTab('reactions',this)"><span class="tab-icon">💬</span>リアクション</button>
</div>

<div class="content">

  <!-- ホーム -->
  <div id="page-home" class="page active">
    <div class="network-warning" id="network-warning">⚠️ インターネット接続が不安定です。声が出ない場合があります。</div>
    <div class="phrase-categories" id="phrase-cats"></div>
  </div>

  <!-- TTS -->
  <div id="page-tts" class="page">
    <div class="tts-area">
      <textarea class="tts-textarea" id="tts-input" placeholder="話したい言葉を入力してください..." oninput="updateCount()"></textarea>
      <div class="char-count"><span id="char-count">0</span> 文字</div>
      <div class="speed-control">
        <div class="speed-label"><span>🎚️ 話す速さ</span><span id="speed-val">標準 (1.0×)</span></div>
        <input type="range" class="speed-slider" id="speed-slider" min="0.5" max="2.0" step="0.1" value="1.0" oninput="updateSpeed()">
      </div>
      <button class="speak-btn" id="speak-btn" onclick="speakText()">
        <span class="spinner" id="spinner"></span>
        <span id="speak-btn-text">🌸 話す</span>
      </button>
      <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="error-msg" id="error-msg">
        <div class="error-msg-title" id="error-title">エラーが発生しました</div>
        <div id="error-detail"></div>
        <button class="retry-btn" onclick="retrySpeak()">🔄 もう一度試す</button>
      </div>
    </div>
    <div class="history-section">
      <div class="section-title">🕐 最近話した言葉</div>
      <div id="history-list"><div style="color:#aaa;font-size:13px;padding:8px">まだ履歴がありません</div></div>
    </div>
  </div>

  <!-- 筆談 -->
  <div id="page-whiteboard" class="page">
    <div class="whiteboard-wrap">
      <canvas id="canvas"></canvas>
      <div class="wb-controls">
        <div class="wb-colors">
          <div class="wb-color active" style="background:#333" data-color="#333" onclick="setColor(this)"></div>
          <div class="wb-color" style="background:#E85555" data-color="#E85555" onclick="setColor(this)"></div>
          <div class="wb-color" style="background:#4A90E2" data-color="#4A90E2" onclick="setColor(this)"></div>
          <div class="wb-color" style="background:#27AE60" data-color="#27AE60" onclick="setColor(this)"></div>
          <div class="wb-color" style="background:#F39C12" data-color="#F39C12" onclick="setColor(this)"></div>
        </div>
        <div class="wb-sizes">
          <div class="wb-size" data-size="3" onclick="setSize(this)">S</div>
          <div class="wb-size active" data-size="6" onclick="setSize(this)">M</div>
          <div class="wb-size" data-size="12" onclick="setSize(this)">L</div>
        </div>
        <button class="wb-btn" style="background:#FFE0E0;color:#c00" onclick="clearCanvas()">🗑️ 消す</button>
      </div>
    </div>
  </div>

  <!-- リアクション -->
  <div id="page-reactions" class="page">
    <div class="reactions-grid" id="reactions-grid"></div>
  </div>

</div>

<!-- フレーズモーダル -->
<div class="modal-overlay" id="phrase-modal" onclick="if(event.target===this)closePhraseModal()">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-phrases"></div>
    <button class="modal-close" onclick="closePhraseModal()">閉じる</button>
  </div>
</div>

<div class="status-bar" id="status-bar">準備完了 🌸</div>
<div class="toast" id="toast"></div>

<script>
// ===== 設定 =====
const VOICE_ID = 'WTQPCUFYlENCEyXVl4PU';
const API_KEY  = 'sk_f623a27ecd3c189e2dec9ee82f806f0e52b6ab4b00ebadf5';
const MAX_RETRIES = 3;
const TIMEOUT_MS  = 20000;

// ===== データ =====
const PHRASES = {
  '⭐ 基本フレーズ':['ありがとう💕','ごめんなさい','はい','いいえ','もう一度お願い','わかった','わからない','大丈夫だよ','うれしい！','ちょっと待って'],
  '🌞 日常会話':['おはよう☀️','おやすみ🌙','いってきます','ただいま','お腹すいた','のどが渇いた','眠い','疲れた','元気だよ','今日もよろしく'],
  '🏥 からだ・病院':['痛い','ここが痛い','気持ち悪い','熱がある','薬をください','トイレに行きたい','休みたい','息苦しい','大丈夫じゃない','ゆっくり話して'],
  '🛍️ 旅行・買い物':['これをください','いくらですか？','クレジットカードは使えますか？','どこですか？','ありがとうございました','もう少し安くなりますか？','試着したい'],
  '💝 こーちゃん':['愛してるよ💕','そばにいてね','ありがとう、いつも','手を握って','声が聞きたかった','あなたがいれば大丈夫','いっしょにいよう','ずっと好きだよ🌸'],
  '🚃 交通機関':['〇〇駅はどこですか？','次は何駅ですか？','乗り換えはありますか？','タクシーを呼んでください','ここで降ります'],
};
const REACTIONS=[
  {e:'😊',l:'うれしい'},{e:'😢',l:'かなしい'},{e:'😂',l:'おかしい'},
  {e:'😍',l:'大好き'},{e:'😴',l:'ねむい'},{e:'😤',l:'いやだ'},
  {e:'🥰',l:'ありがとう'},{e:'😣',l:'つらい'},{e:'🤔',l:'わからない'},
  {e:'👍',l:'いいよ'},{e:'👋',l:'またね'},{e:'🆘',l:'助けて'},
];

let history = JSON.parse(localStorage.getItem('mk_history')||'[]');
let speechRate = 1.0;
let lastText = '';
let audioCtx = null;

// ===== 初期化 =====
function init(){
  // iPhone Safari AudioContext初期化（ユーザー操作が必要）
  document.addEventListener('touchstart', initAudioContext, {once:true});
  document.addEventListener('click', initAudioContext, {once:true});
  buildPhraseCategories();
  buildReactions();
  initCanvas();
  renderHistory();
  checkNetwork();
  window.addEventListener('online',  ()=>{ document.getElementById('network-warning').classList.remove('show'); setStatus('ネットワーク復旧 ✅'); });
  window.addEventListener('offline', ()=>{ document.getElementById('network-warning').classList.add('show'); setStatus('オフライン ⚠️','err'); });
}

function initAudioContext(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
}

function checkNetwork(){
  if(!navigator.onLine) document.getElementById('network-warning').classList.add('show');
}

// ===== フレーズ =====
function buildPhraseCategories(){
  const grid=document.getElementById('phrase-cats');
  Object.entries(PHRASES).forEach(([cat,phrases])=>{
    const parts=cat.split(' ');
    const btn=document.createElement('button');
    btn.className='phrase-cat';
    btn.innerHTML=`<span class="phrase-cat-icon">${parts[0]}</span><div class="phrase-cat-name">${parts.slice(1).join(' ')}</div><div class="phrase-cat-count">${phrases.length}フレーズ</div>`;
    btn.onclick=()=>openPhraseModal(cat,phrases);
    grid.appendChild(btn);
  });
}

function openPhraseModal(cat,phrases){
  document.getElementById('modal-title').textContent=cat;
  const c=document.getElementById('modal-phrases');
  c.innerHTML='';
  phrases.forEach(p=>{
    const d=document.createElement('div');
    d.className='phrase-item';
    d.innerHTML=`<span>🔊</span><span>${p}</span>`;
    d.onclick=()=>{ doSpeak(p); closePhraseModal(); };
    c.appendChild(d);
  });
  document.getElementById('phrase-modal').classList.add('open');
}
function closePhraseModal(){ document.getElementById('phrase-modal').classList.remove('open'); }

// ===== リアクション =====
function buildReactions(){
  const grid=document.getElementById('reactions-grid');
  REACTIONS.forEach(r=>{
    const btn=document.createElement('button');
    btn.className='reaction-btn';
    btn.innerHTML=`<span class="reaction-emoji">${r.e}</span><span class="reaction-label">${r.l}</span>`;
    btn.onclick=()=>doSpeak(r.l);
    grid.appendChild(btn);
  });
}

// ===== TTS =====
async function speakText(){
  const text=document.getElementById('tts-input').value.trim();
  if(!text){ showToast('テキストを入力してください'); return; }
  lastText=text;
  await doSpeak(text);
}

async function retrySpeak(){
  if(lastText) await doSpeak(lastText);
}

async function doSpeak(text){
  initAudioContext();
  setBtnState('loading');
  hideError();
  setStatus('🎙️ 生成中...','speaking');
  showProgress(10);

  let lastError = null;
  for(let attempt=1; attempt<=MAX_RETRIES; attempt++){
    try{
      if(attempt>1){
        setStatus(`🔄 リトライ中... (${attempt}/${MAX_RETRIES})`,'speaking');
        showProgress(attempt*15);
        await sleep(800*(attempt-1));
      }
      const audioUrl = await fetchSpeech(text);
      showProgress(80);
      await playAudio(audioUrl);
      showProgress(100);
      setBtnState('success');
      setStatus('✅ 再生完了');
      addHistory(text);
      setTimeout(()=>{ setBtnState('normal'); setStatus('準備完了 🌸'); hideProgress(); }, 1500);
      return;
    }catch(e){
      lastError=e;
      console.error(`Attempt ${attempt} failed:`, e);
    }
  }
  // 全試行失敗
  setBtnState('error');
  showError(lastError);
  setStatus('❌ エラー','err');
  hideProgress();
}

async function fetchSpeech(text){
  const controller = new AbortController();
  const timeoutId = setTimeout(()=>controller.abort(), TIMEOUT_MS);
  try{
    const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`,{
      method:'POST',
      headers:{'xi-api-key':API_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({
        text:text,
        model_id:'eleven_multilingual_v2',
        voice_settings:{stability:0.5,similarity_boost:0.75,style:0,use_speaker_boost:true}
      }),
      signal:controller.signal
    });
    clearTimeout(timeoutId);
    if(!res.ok){
      const errData = await res.json().catch(()=>({}));
      if(res.status===401) throw new Error('APIキーが無効です (401)');
      if(res.status===429) throw new Error('利用制限に達しました。しばらく待ってください (429)');
      if(res.status===500) throw new Error('ElevenLabsサーバーエラーです (500)');
      throw new Error(errData.detail?.message || `エラー ${res.status}`);
    }
    const blob = await res.blob();
    return URL.createObjectURL(blob);
  }catch(e){
    clearTimeout(timeoutId);
    if(e.name==='AbortError') throw new Error('タイムアウトしました（20秒）。ネットワークを確認してください。');
    throw e;
  }
}

async function playAudio(url){
  return new Promise((resolve,reject)=>{
    const audio = new Audio(url);
    // iPhone Safari対応
    audio.setAttribute('playsinline','');
    audio.setAttribute('webkit-playsinline','');
    audio.onended = ()=>{ URL.revokeObjectURL(url); resolve(); };
    audio.onerror = (e)=>{ URL.revokeObjectURL(url); reject(new Error('音声再生エラー。音量を確認してください。')); };
    // AudioContextを使って再生（iOS Safari対応）
    if(audioCtx && audioCtx.state==='running'){
      const source = audioCtx.createMediaElementSource ? null : null;
    }
    const playPromise = audio.play();
    if(playPromise!==undefined){
      playPromise.catch(e=>{
        // 自動再生ブロック対応
        if(e.name==='NotAllowedError'){
          // ユーザーのタップを待って再生
          document.addEventListener('touchend', ()=>audio.play(), {once:true});
          document.addEventListener('click', ()=>audio.play(), {once:true});
          showToast('画面をタップすると再生されます');
          audio.onended = ()=>resolve();
        } else {
          reject(e);
        }
      });
    }
  });
}

// ===== UI状態管理 =====
function setBtnState(state){
  const btn=document.getElementById('speak-btn');
  const txt=document.getElementById('speak-btn-text');
  const sp=document.getElementById('spinner');
  const dot=document.getElementById('status-dot');
  btn.disabled = state==='loading';
  btn.className = 'speak-btn' + (state==='loading'?' loading':state==='success'?' success':state==='error'?' error-state':'');
  sp.className = 'spinner' + (state==='loading'?' show':'');
  txt.textContent = state==='loading'?'生成中...':state==='success'?'✅ 再生中':state==='error'?'❌ エラー':'🌸 話す';
  dot.className = 'status-indicator' + (state==='loading'?' loading':state==='error'?' error':'');
}

function showError(e){
  const msg=document.getElementById('error-msg');
  const detail=document.getElementById('error-detail');
  const title=document.getElementById('error-title');
  let titleText='エラーが発生しました';
  let detailText=e?.message||'不明なエラー';
  if(detailText.includes('タイムアウト')) titleText='⏱ タイムアウト';
  else if(detailText.includes('429')) titleText='⚠️ 利用制限';
  else if(detailText.includes('401')) titleText='🔑 認証エラー';
  else if(detailText.includes('500')) titleText='🔧 サーバーエラー';
  else if(detailText.includes('再生')) titleText='🔊 再生エラー';
  title.textContent=titleText;
  detail.textContent=detailText;
  msg.classList.add('show');
}
function hideError(){ document.getElementById('error-msg').classList.remove('show'); }
function showProgress(pct){
  const bar=document.getElementById('progress-bar');
  bar.classList.add('show');
  document.getElementById('progress-fill').style.width=pct+'%';
}
function hideProgress(){
  setTimeout(()=>{
    document.getElementById('progress-bar').classList.remove('show');
    document.getElementById('progress-fill').style.width='0%';
  },500);
}

function setStatus(msg,cls=''){
  const bar=document.getElementById('status-bar');
  bar.textContent=msg;
  bar.className='status-bar'+(cls?' '+cls:'');
}

// ===== 履歴 =====
function addHistory(text){
  history=[text,...history.filter(h=>h!==text)].slice(0,15);
  localStorage.setItem('mk_history',JSON.stringify(history));
  renderHistory();
}
function renderHistory(){
  const el=document.getElementById('history-list');
  if(!history.length){ el.innerHTML='<div style="color:#aaa;font-size:13px;padding:8px">まだ履歴がありません</div>'; return; }
  el.innerHTML=history.map(h=>`<div class="history-item" onclick="doSpeak('${h.replace(/'/g,"\\'")}')">${h}<span style="color:#aaa;margin-left:8px">🔊</span></div>`).join('');
}

// ===== UI =====
function updateCount(){ document.getElementById('char-count').textContent=document.getElementById('tts-input').value.length; }
function updateSpeed(){
  speechRate=parseFloat(document.getElementById('speed-slider').value);
  const labels={0.5:'ゆっくり (0.5×)',0.75:'少しゆっくり',1.0:'標準 (1.0×)',1.25:'少し速め',1.5:'速め (1.5×)',2.0:'とても速い'};
  document.getElementById('speed-val').textContent=labels[speechRate]||`${speechRate}×`;
}
function showTab(name,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  el.classList.add('active');
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

// ===== 筆談ボード =====
function initCanvas(){
  const canvas=document.getElementById('canvas');
  canvas.width=canvas.parentElement.offsetWidth||340;
  canvas.height=280;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  let drawing=false,color='#333',size=6;
  window.setColor=el=>{color=el.dataset.color;document.querySelectorAll('.wb-color').forEach(e=>e.classList.remove('active'));el.classList.add('active')};
  window.setSize=el=>{size=parseInt(el.dataset.size);document.querySelectorAll('.wb-size').forEach(e=>e.classList.remove('active'));el.classList.add('active')};
  window.clearCanvas=()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height)};
  const pos=e=>{const r=canvas.getBoundingClientRect(),s=e.touches?e.touches[0]:e;return{x:(s.clientX-r.left)*(canvas.width/r.width),y:(s.clientY-r.top)*(canvas.height/r.height)}};
  canvas.addEventListener('mousedown',e=>{drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});
  canvas.addEventListener('mousemove',e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.strokeStyle=color;ctx.lineWidth=size;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()});
  canvas.addEventListener('mouseup',()=>drawing=false);
  canvas.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)},{passive:false});
  canvas.addEventListener('touchmove',e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.strokeStyle=color;ctx.lineWidth=size;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()},{passive:false});
  canvas.addEventListener('touchend',()=>drawing=false);
}

init();
</script>
