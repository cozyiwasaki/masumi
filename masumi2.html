<title>ますみのこえ ２</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,"Hiragino Sans",sans-serif;background:#FFF5F3;color:#2D1A1A;min-height:100vh;overscroll-behavior:none;}
#topbar{position:fixed;top:0;left:0;right:0;z-index:99;background:rgba(255,245,243,0.97);border-bottom:1.5px solid #FFD5CC;display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 16px 10px;min-height:50px;}
#appTitle{font-size:18px;font-weight:800;color:#E85555;display:flex;align-items:center;gap:6px;}
#backBtn{display:none;background:none;border:none;font-size:15px;font-weight:700;color:#E85555;cursor:pointer;font-family:inherit;padding:4px 8px;border-radius:8px;}
#topRight{display:flex;align-items:center;gap:8px;}
#loadBtn{background:#E85555;color:white;border:none;border-radius:20px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
#loadBtn.loaded{background:#C04040;}
#fileLoaded{font-size:12px;color:#AA7070;display:none;}
#main{padding-top:calc(max(14px,env(safe-area-inset-top)) + 50px);padding-bottom:calc(72px + env(safe-area-inset-bottom));}
#bottomNav{position:fixed;bottom:0;left:0;right:0;z-index:98;background:rgba(255,245,243,0.97);border-top:1.5px solid #FFD5CC;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;padding:4px 0 calc(4px + env(safe-area-inset-bottom));}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:none;cursor:pointer;font-family:inherit;padding:5px 0;}
.nav-ic{font-size:22px;}
.nav-lb{font-size:10px;font-weight:700;color:#CCAAAA;}
.nav-btn.active .nav-lb{color:#E85555;}
.nav-btn.active .nav-ic{transform:scale(1.08);}
#homeScreen{display:block;}
.home-pad{padding:14px 14px 0;}
.home-section-title{font-size:12px;font-weight:700;color:#AA7070;letter-spacing:0.8px;margin:14px 0 8px;text-transform:uppercase;}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px;}
.cat-card{background:white;border-radius:18px;border:2px solid #FFD5CC;padding:18px 10px;text-align:center;cursor:pointer;box-shadow:0 2px 10px rgba(232,85,85,0.06);transition:transform 0.1s;position:relative;overflow:hidden;}
.cat-card:active{transform:scale(0.96);}
.cat-card .badge{position:absolute;top:8px;right:8px;background:#E85555;color:white;font-size:10px;font-weight:700;border-radius:10px;padding:2px 7px;display:none;}
.cat-card.has-files .badge{display:block;}
.cat-emoji{font-size:38px;margin-bottom:6px;}
.cat-name{font-size:15px;font-weight:700;color:#2D1A1A;}
.cat-sub{font-size:11px;color:#AA7070;margin-top:3px;}
.cat-card.special{background:linear-gradient(135deg,#E85555,#FF7A7A);border-color:#E85555;}
.cat-card.special .cat-name{color:white;}
.cat-card.special .cat-sub{color:rgba(255,255,255,0.8);}
#phraseScreen{display:none;}
.phrase-pad{padding:12px 14px 0;}
#phraseSearch{width:100%;padding:11px 14px;border:1.5px solid #FFE0DC;border-radius:14px;font-size:16px;font-family:inherit;background:white;outline:none;margin-bottom:12px;}
#phraseSearch:focus{border-color:#E85555;}
.phrase-grid{display:flex;flex-direction:column;gap:8px;}
.phrase-btn{width:100%;background:white;border:1.5px solid #FFE0DC;border-radius:14px;padding:14px 56px 14px 16px;font-size:16px;font-weight:500;text-align:left;cursor:pointer;font-family:inherit;position:relative;line-height:1.4;color:#2D1A1A;}
.phrase-btn:active{background:#FFF5F3;}
.phrase-btn.playing{border-color:#E85555;background:#FFF5F3;}
.play-ic{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:#E85555;color:white;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.play-ic.on{background:#FF8A80;animation:pulse 0.7s ease infinite alternate;}
@keyframes pulse{from{transform:translateY(-50%) scale(1);}to{transform:translateY(-50%) scale(1.15);}}
.tts-badge{font-size:10px;background:#FFF0F0;color:#E85555;border:1px solid #FFD5CC;border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:middle;}
#ttsScreen{display:none;}
.tts-pad{padding:14px 14px 0;}
.card{background:white;border-radius:18px;border:1.5px solid #FFD5CC;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(232,85,85,0.05);}
.card-title{font-size:12px;font-weight:700;color:#AA7070;letter-spacing:0.5px;margin-bottom:10px;}
#ttsInput{width:100%;min-height:100px;padding:11px;border:1.5px solid #FFE0DC;border-radius:12px;font-size:17px;font-family:inherit;line-height:1.7;background:#FFFAFA;outline:none;resize:none;color:#2D1A1A;}
#ttsInput:focus{border-color:#E85555;background:white;}
#ttsInput::placeholder{color:#CCAAAA;}
#ttsCharCount{text-align:right;font-size:12px;color:#CCAAAA;margin-top:4px;}
.speed-row{display:flex;align-items:center;gap:8px;}
.speed-row span{font-size:12px;color:#AA7070;}
#spSlider{flex:1;accent-color:#E85555;}
#speedVal{font-size:13px;font-weight:700;color:#E85555;text-align:center;margin-top:4px;}
#ttsSpeakBtn{width:100%;padding:17px;margin-bottom:12px;background:linear-gradient(135deg,#E85555,#FF7A7A);color:white;border:none;border-radius:16px;font-size:19px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 5px 18px rgba(232,85,85,0.35);display:flex;align-items:center;justify-content:center;gap:8px;}
#ttsSpeakBtn:active{opacity:0.85;}
#ttsSpeakBtn:disabled{background:#FFAAAA;box-shadow:none;}
#ttsStatusBox{display:none;align-items:center;gap:10px;background:white;border-radius:12px;border:1.5px solid #FFE0DC;padding:11px 14px;margin-bottom:12px;}
#ttsStatusBox.show{display:flex;}
#ttsProgress{height:3px;background:#FFE0DC;border-radius:2px;overflow:hidden;margin-bottom:12px;display:none;}
#ttsProgressFill{height:100%;background:#E85555;animation:tprog 1.5s ease infinite;}
@keyframes tprog{0%{width:0%;margin-left:0%;}50%{width:60%;margin-left:20%;}100%{width:0%;margin-left:100%;}}
.quick-wrap{display:flex;flex-wrap:wrap;gap:7px;}
.quick-btn{background:#FFF5F3;border:1.5px solid #FFD5CC;border-radius:18px;padding:7px 13px;font-size:14px;font-weight:600;color:#E85555;cursor:pointer;font-family:inherit;}
.quick-btn:active{background:#FFE8E4;}
.hist-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #FFF0EE;cursor:pointer;}
.hist-row:last-child{border-bottom:none;}
.hist-txt{font-size:15px;font-weight:500;flex:1;line-height:1.4;}
.hist-ic{width:32px;height:32px;border-radius:50%;background:#E85555;color:white;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;}
.hist-ic.on{background:#FF8A80;animation:pulse2 0.7s ease infinite alternate;}
@keyframes pulse2{from{transform:scale(1);}to{transform:scale(1.15);}}
#hwCanvasWrap{border:2px dashed #FFD5CC;border-radius:12px;background:#FFFAFA;overflow:hidden;touch-action:none;}
#hwCanvas{display:block;width:100%;cursor:crosshair;}
.hw-toolbar{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
.hw-col{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;}
.hw-col.active{border-color:#E85555;}
.hw-tool{background:#FFF5F3;border:1.5px solid #FFD5CC;border-radius:16px;padding:6px 12px;font-size:12px;font-weight:600;color:#E85555;cursor:pointer;font-family:inherit;}
.hw-tool:active{background:#FFE8E4;}
#hwReadBtn{flex:1;background:linear-gradient(135deg,#E85555,#FF7A7A);color:white;border:none;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:4px;}
#hwReadBtn:disabled{background:#FFAAAA;}
#hwStatus{font-size:12px;color:#AA7070;margin-top:5px;text-align:center;min-height:15px;}

/* ── 筆談画面（全画面固定） ── */
#hdCanvas{position:fixed;top:0;left:0;width:100vw !important;height:100vh !important;z-index:200;background:white;touch-action:none;-webkit-user-select:none;user-select:none;display:none;cursor:crosshair;}
#hdCanvas.show{display:block;}
#hdTopBar{position:fixed;top:0;left:0;right:0;z-index:210;display:none;align-items:center;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 14px 8px;background:rgba(255,255,255,0.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #eee;min-height:48px;}
#hdTopBar.show{display:flex;}
#hdTopBar h2{font-size:16px;font-weight:700;color:#2D1A1A;}
.hd-act{width:40px;height:40px;border-radius:10px;border:none;background:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.hd-act:active{background:rgba(0,0,0,0.07);}

/* ★ 修正箇所：コントロールを上部（タイトルバー直下）に移動 ★ */
#hdBottomBar{
  position:fixed;
  top:calc(max(12px,env(safe-area-inset-top)) + 54px);
  left:0;right:0;z-index:210;
  display:none;align-items:center;gap:10px;
  padding:8px 14px;
  background:rgba(255,255,255,0.97);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:2px solid #FFD5CC;
  box-shadow:0 3px 10px rgba(232,85,85,0.08);
}
#hdBottomBar.show{display:flex;}
.hd-col{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent;flex-shrink:0;}
.hd-col.active{border-color:#E85555;box-shadow:0 0 0 2px #E85555;}
#hdSizeSlider{flex:1;accent-color:#2D1A1A;}
#hdEraserBtn{padding:7px 13px;border-radius:18px;border:1.5px solid #ddd;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;background:white;color:#666;white-space:nowrap;}

/* ELモード */
#elScreen{display:none;}
.el-pad{padding:14px 14px 0;}
#elDisplay{background:white;border-radius:20px;border:2px solid #FFD5CC;padding:24px 20px;margin-bottom:14px;min-height:160px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(232,85,85,0.08);position:relative;}
#elDisplayText{font-size:28px;font-weight:700;color:#2D1A1A;text-align:center;line-height:1.6;word-break:break-all;width:100%;}
#elDisplayText.empty{font-size:15px;color:#CCAAAA;font-weight:400;}
#elListening{position:absolute;top:10px;right:12px;font-size:12px;font-weight:700;color:#E85555;display:none;align-items:center;gap:4px;}
#elListening.on{display:flex;}
.el-dot{width:8px;height:8px;border-radius:50%;background:#E85555;animation:eldot 1s ease infinite alternate;}
@keyframes eldot{from{opacity:0.3;}to{opacity:1;}}
#elMicBtn{width:100%;padding:22px;margin-bottom:12px;background:linear-gradient(135deg,#E85555,#FF7A7A);color:white;border:none;border-radius:20px;font-size:20px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 6px 24px rgba(232,85,85,0.4);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform 0.1s;}
#elMicBtn:active{transform:scale(0.97);}
#elMicBtn.listening{background:linear-gradient(135deg,#CC2222,#EE4444);animation:micpulse 1s ease infinite alternate;}
@keyframes micpulse{from{box-shadow:0 6px 24px rgba(232,85,85,0.4);}to{box-shadow:0 6px 40px rgba(232,85,85,0.8);}}
#elSpeakBtn{width:100%;padding:16px;margin-bottom:12px;background:white;color:#E85555;border:2px solid #E85555;border-radius:16px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
#elSpeakBtn:active{background:#FFF5F3;}
#elSpeakBtn:disabled{opacity:0.4;}
#elClearBtn{width:100%;padding:12px;margin-bottom:14px;background:white;color:#AA7070;border:1.5px solid #FFD5CC;border-radius:14px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;}
#elStatus{text-align:center;font-size:14px;color:#AA7070;margin-bottom:12px;min-height:20px;}
.el-hist-item{background:white;border-radius:14px;border:1.5px solid #FFE0DC;padding:12px 48px 12px 14px;margin-bottom:8px;font-size:16px;font-weight:500;color:#2D1A1A;cursor:pointer;position:relative;line-height:1.5;}
.el-hist-item:active{background:#FFF5F3;}
.el-hist-play{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:#E85555;color:white;display:flex;align-items:center;justify-content:center;font-size:12px;}
.el-hist-play.on{background:#FF8A80;animation:pulse2 0.7s ease infinite alternate;}
#reactionScreen{display:none;}
.reaction-pad{padding:8px 8px 0;}
.reaction-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:8px;}
.rx-btn{background:white;border:1.5px solid #FFD5CC;border-radius:14px;padding:6px 4px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:70px;transition:transform 0.1s;box-shadow:0 2px 6px rgba(232,85,85,0.06);position:relative;overflow:hidden;}
.rx-btn:active{transform:scale(0.93);background:#FFF5F3;border-color:#E85555;}
.rx-btn.playing{background:#FFF0F0;border-color:#E85555;}
.rx-ic{font-size:26px;line-height:1;}
.rx-lb{font-size:11px;font-weight:700;color:#2D1A1A;text-align:center;line-height:1.2;}
.rx-btn.playing .rx-lb{color:#E85555;}
</style>
</head>

<input type="file" id="fileInput" multiple style="display:none">
<div id="topbar">
  <button id="backBtn" onclick="goBack()">◀ もどる</button>

  <div id="topRight">

<div id="main">

    <div class="cat-card special" onclick="openSpecial('hitsudan')" style="border:none;"><div class="cat-emoji">🖊️</div><div class="cat-name">筆談ボード</div><div class="cat-sub">手書きで伝える</div></div>

    <div class="cat-card" id="card-nichijo" onclick="openCat('nichijo')"><div class="badge" id="badge-nichijo">0</div><div class="cat-emoji">🌞</div><div class="cat-name">日常会話</div><div class="cat-sub">毎日のあいさつ・気持ち</div></div>
    <div class="cat-card" id="card-karada" onclick="openCat('karada')"><div class="badge" id="badge-karada">0</div><div class="cat-emoji">🏥</div><div class="cat-name">からだ・病院</div><div class="cat-sub">体調・痛み・医療</div></div>
    <div class="cat-card" id="card-shopping" onclick="openCat('shopping')"><div class="badge" id="badge-shopping">0</div><div class="cat-emoji">🛍️</div><div class="cat-name">旅行・買い物</div><div class="cat-sub">お店・移動・注文</div></div>

    <div class="cat-card" id="card-other" onclick="openCat('other')"><div class="badge" id="badge-other">0</div><div class="cat-emoji">📁</div><div class="cat-name">その他</div><div class="cat-sub">読み込んだ音声</div></div>
  </div>
  <div style="height:8px;"></div>
</div>
</div>
<div id="phraseScreen">
<div class="phrase-pad">
  <input type="text" id="phraseSearch" placeholder="🔍 ことばを検索..." oninput="renderPhrases()">
  <div id="phraseList"></div>
</div>
</div>
<div id="ttsScreen">
<div class="tts-pad">
  <div class="card"><div class="card-title" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;"><span>💬 話したい言葉を入力</span><button class="hd-act" onclick="ttsClearAll()" title="全部消す" aria-label="入力を全部消す">🗑️</button></div><textarea id="ttsInput" placeholder="ここに入力してください&#10;例：ありがとう、大好きだよ" oninput="ttsOnInput()"></textarea><div id="ttsCharCount">0 文字</div></div>
  <div class="card"><div class="card-title">🎚️ 話す速さ</div><div class="speed-row"><span>遅い</span><input type="range" id="spSlider" min="0.7" max="1.3" step="0.05" value="1.0" oninput="onSpeedChange()"><span>速い</span></div><div id="speedVal">標準 (1.0×)</div></div>
  <button id="ttsSpeakBtn" onclick="doTTS()"><span id="ttsBtnIcon">🌸</span><span id="ttsBtnTxt">話す</span></button>
  <div id="ttsStatusBox"><span id="ttsStatusIcon">⏳</span><div><div id="ttsStatusText"></div><div id="ttsStatusSub" style="font-size:12px;color:#AA7070;margin-top:2px;"></div></div></div>
  <div id="ttsProgress"><div id="ttsProgressFill"></div></div>
  <div class="card"><div class="card-title">⚡ よく使う言葉</div><div class="quick-wrap" id="quickWrap"></div></div>
  <div class="card"><div class="card-title">🕐 最近話した言葉</div><div id="ttsHistList"><div style="color:#CCAAAA;font-size:14px;text-align:center;padding:8px 0;">まだ履歴がありません</div></div></div>
</div>
</div>
<div id="reactionScreen">
<div class="reaction-pad">
<div class="reaction-grid" id="reactionGrid"></div>
</div>
</div>
</div>
<div id="elScreen">
<div class="el-pad">
  <div id="elDisplay"><div id="elDisplayText" class="empty">ELで話してください</div><div id="elListening"><div class="el-dot"></div>認識中...</div></div>
  <button id="elMicBtn" onclick="elToggleMic()"><span id="elMicIcon">🎤</span><span id="elMicTxt">タップして話す</span></button>
  <button id="elSpeakBtn" onclick="elSpeak()" disabled>🌸 ますみの声で話す</button>
  <button id="elClearBtn" onclick="elClear()">🗑️ クリア</button>
  <div id="elStatus"></div>
  <div class="card"><div class="card-title">🕐 最近の発話</div><div id="elHistList"><div style="color:#CCAAAA;font-size:14px;text-align:center;padding:8px 0;">まだ履歴がありません</div></div></div>
</div>
</div>
<div id="bottomNav" style="grid-template-columns:1fr 1fr 1fr 1fr;">
  <button class="nav-btn active" id="navHome" onclick="switchTab('home')"><span class="nav-ic">🏠</span><span class="nav-lb">ホーム</span></button>
  <button class="nav-btn" id="navTTS" onclick="switchTab('tts')"><span class="nav-ic">🎙️</span><span class="nav-lb">読み上げ</span></button>
  <button class="nav-btn" id="navHD" onclick="switchTab('hitsudan')"><span class="nav-ic">🖊️</span><span class="nav-lb">筆談</span></button>

</div>

function buildCatMap(){
  CATS.forEach(function(cat){CAT_MAP[cat.id]=[];});CAT_MAP['other']=[];
  Object.keys(FILES).forEach(function(name){
    var lower=name.toLowerCase(),matched=false;
    for(var i=0;i<CATS.length;i++){var cat=CATS[i];for(var j=0;j<cat.keys.length;j++){if(lower.includes(cat.keys[j])){CAT_MAP[cat.id].push(name);matched=true;break;}}if(matched)break;}
    if(!matched)CAT_MAP['other'].push(name);
  });
}

function playFile(name){
  unlockSession(function(){
    var file=FILES[name];if(!file)return;stopCurrent();
    if(audioCache[name]){playBuf(audioCache[name],name);return;}
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    var pic=document.getElementById('pic-'+encodeURIComponent(name));if(pic)pic.textContent='⏳';
    if(file._fromGitHub){
      var xhr=new XMLHttpRequest();xhr.open('GET',file._rawUrl,true);xhr.responseType='arraybuffer';
      xhr.onload=function(){if(xhr.status===200){actx.decodeAudioData(xhr.response.slice(0),function(buf){audioCache[name]=buf;playBuf(buf,name);},function(e){if(pic)pic.textContent='▶';});}else{if(pic)pic.textContent='▶';}};
      xhr.onerror=function(){if(pic)pic.textContent='▶';};xhr.send();
    }else if(file._fromDB){actx.decodeAudioData(file._buf.slice(0),function(buf){audioCache[name]=buf;playBuf(buf,name);},function(e){});}
    else{var fr=new FileReader();fr.onload=function(e){actx.decodeAudioData(e.target.result.slice(0),function(buf){audioCache[name]=buf;playBuf(buf,name);});};fr.readAsArrayBuffer(file);}
  });
}
function playBuf(buf,name){
  var pic=document.getElementById('pic-'+encodeURIComponent(name));
  playAudioBuffer(buf, function(){
    if(curPlayBtn){curPlayBtn.classList.remove('on');curPlayBtn.textContent='▶';}
    curPlay=null;curPlayBtn=null;
  }, function(e){
    if(pic){pic.textContent='▶';}
    curPlay=null;curPlayBtn=null;
    showAudioError();
  });
  curPlay={stop:function(){try{if(curPlayBtn){curPlayBtn.classList.remove('on');curPlayBtn.textContent='▶';}curPlayBtn=null;}catch(e){}}};
  if(pic){pic.classList.add('on');pic.textContent='♪';curPlayBtn=pic;}
}
function stopCurrent(){if(curPlay){try{curPlay.stop();}catch(e){}curPlay=null;}if(curPlayBtn){curPlayBtn.classList.remove('on');curPlayBtn.textContent='▶';curPlayBtn=null;}}
function playTTSPhrase(phrase,picId){
  var pic=document.getElementById(picId);if(pic)pic.textContent='⏳';
  ttsCall(phrase,1.0,function(decoded){
    stopCurrent();if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    var gain=actx.createGain();gain.gain.value=1.0;gain.connect(actx.destination);
    var src=actx.createBufferSource();src.buffer=decoded;src.connect(gain);src.start(0);curPlay=src;
    if(pic){pic.classList.add('on');pic.textContent='♪';curPlayBtn=pic;}
    src.onended=function(){if(curPlayBtn){curPlayBtn.classList.remove('on');curPlayBtn.textContent='▶';}curPlay=null;curPlayBtn=null;};
  },function(){if(pic)pic.textContent='▶';});
}
// ── 改善版ttsCall（3回リトライ付き・タイムアウト付き） ──
function ttsCallOnce(text,speed,onSuccess,onError){
  var ctx=getActx();
  var xhr=new XMLHttpRequest();
  xhr.open('POST','https://api.elevenlabs.io/v1/text-to-speech/'+TTS_VID,true);
  xhr.setRequestHeader('Content-Type','application/json');xhr.setRequestHeader('xi-api-key',TTS_API);
  xhr.responseType='arraybuffer';
  xhr.timeout=20000;
  xhr.onload=function(){
    if(xhr.status>=200&&xhr.status<300){
      ensureActxRunning(function(c){
        c.decodeAudioData(xhr.response.slice(0),function(decoded){onSuccess(decoded);},function(e){if(onError)onError('decode');});
      });
    }else{if(onError)onError('HTTP_'+xhr.status);}
  };
  xhr.onerror=function(){if(onError)onError('network');};
  xhr.ontimeout=function(){if(onError)onError('timeout');};
  xhr.send(JSON.stringify({text:text,model_id:'eleven_multilingual_v2',voice_settings:{stability:0.5,similarity_boost:0.85,speed:speed||1.0}}));
}

function ttsCall(text,speed,onSuccess,onError,_attempt){
  var attempt=_attempt||1;
  ttsCallOnce(text,speed,onSuccess,function(err){
    console.warn('TTS attempt',attempt,'failed:',err);
    if(attempt<3){
      // リトライ前にAudioContextをリフレッシュ
      if(err==='decode'||err==='timeout'){actx=null;sessionOK=false;}
      var delay=attempt*800;
      setTimeout(function(){ttsCall(text,speed,onSuccess,onError,attempt+1);},delay);
    }else{
      if(onError)onError(err);
    }
  });
}
function ttsClearAll(){var t=document.getElementById('ttsInput');t.value='';ttsOnInput();t.focus();}

function doTTS(){
  var text=document.getElementById('ttsInput').value.trim();if(!text){ttsSetSt('⚠️','入力してください','');return;}
  ttsSetLoading(true);ttsSetSt('⏳','生成中...','ますみさんの声を作っています');document.getElementById('ttsProgress').style.display='block';
  var spd=parseFloat(document.getElementById('spSlider').value);
  unlockSession(function(){
    ttsCall(text,spd,function(decoded){
      ttsSoundStop();
      ttsSetSt('🎵','再生中...','');document.getElementById('ttsProgress').style.display='none';ttsSetLoading(false);ttsAddHist(text,decoded);
      var ttsRef={stopped:false};
      ttsAudio={stop:function(){ttsRef.stopped=true;ttsClearSt();}};
      playAudioBuffer(decoded,function(){if(!ttsRef.stopped)ttsClearSt();ttsAudio=null;},function(e){ttsSetSt('❌','音声再生エラー','ページ上のバナーから修復できます');ttsSetLoading(false);showAudioError();ttsAudio=null;});
    },function(errCode){
      var msg=errCode==='network'?'通信エラー。インターネット接続を確認':errCode==='decode'?'音声デコードエラー':'エラー('+errCode+')。もう一度試してください';
      ttsSetSt('❌',msg,'');document.getElementById('ttsProgress').style.display='none';ttsSetLoading(false);
    });
  });
}
function ttsSoundStop(){if(ttsAudio){try{ttsAudio.stop();}catch(e){}ttsAudio=null;}if(ttsHistBtn){ttsHistBtn.classList.remove('on');ttsHistBtn.textContent='▶';ttsHistBtn=null;}}

function ttsAddHist(text,decoded){
  ttsHist=ttsHist.filter(function(h){return h.text!==text;});ttsHist.unshift({text:text,decoded:decoded});if(ttsHist.length>15)ttsHist.pop();
  var c=document.getElementById('ttsHistList');c.innerHTML='';
  ttsHist.forEach(function(item){
    var row=document.createElement('div');row.className='hist-row';var txt=document.createElement('span');txt.className='hist-txt';txt.textContent=item.text;var ic=document.createElement('div');ic.className='hist-ic';ic.textContent='▶';
    row.appendChild(txt);row.appendChild(ic);
    row.addEventListener('click',function(){
      document.getElementById('ttsInput').value=item.text;ttsOnInput();ttsSoundStop();
      if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
      var gain=actx.createGain();gain.gain.value=1.0;gain.connect(actx.destination);var src=actx.createBufferSource();src.buffer=item.decoded;src.connect(gain);src.start(0);
      ttsAudio=src;ttsHistBtn=ic;ic.classList.add('on');ic.textContent='♪';src.onended=function(){ic.classList.remove('on');ic.textContent='▶';ttsAudio=null;ttsHistBtn=null;};
    });c.appendChild(row);
  });
}

var hwCol='#1A1A1A',hwSz=5,hwDrawing=false,hwHas=false,hwCtx=null;
function initHwCanvas(){
  var canvas=document.getElementById('hwCanvas');var wrap=document.getElementById('hwCanvasWrap');if(!canvas||!wrap)return;var w=wrap.clientWidth;if(w<=0)return;canvas.width=w;canvas.height=170;
  if(!hwCtx){hwCtx=canvas.getContext('2d');function gp(e){var r=canvas.getBoundingClientRect();var t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*(canvas.width/r.width),y:(t.clientY-r.top)*(canvas.height/r.height)};}
  function sd(e){e.preventDefault();hwDrawing=true;hwHas=true;var p=gp(e);hwCtx.beginPath();hwCtx.moveTo(p.x,p.y);hwCtx.strokeStyle=hwCol;hwCtx.lineWidth=hwSz;hwCtx.lineCap='round';hwCtx.lineJoin='round';}
  function md(e){e.preventDefault();if(!hwDrawing)return;var p=gp(e);hwCtx.lineTo(p.x,p.y);hwCtx.stroke();hwCtx.beginPath();hwCtx.moveTo(p.x,p.y);hwCtx.strokeStyle=hwCol;hwCtx.lineWidth=hwSz;}
  function ed(e){e.preventDefault();hwDrawing=false;}
  canvas.addEventListener('mousedown',sd);canvas.addEventListener('mousemove',md);canvas.addEventListener('mouseup',ed);canvas.addEventListener('touchstart',sd,{passive:false});canvas.addEventListener('touchmove',md,{passive:false});canvas.addEventListener('touchend',ed,{passive:false});}
  hwCtx.lineCap='round';hwCtx.lineJoin='round';
}

var hdCol='#1A1A1A',hdSz=10,hdDrawing=false,hdCtx=null,hdEraser=false,hdStrokes=[];
function initHdCanvas(){
  var canvas=document.getElementById('hdCanvas');if(!canvas)return;
  var w=window.innerWidth,h=window.innerHeight;var saved=null;
  if(hdCtx&&canvas.width>0&&canvas.height>0){try{saved=hdCtx.getImageData(0,0,canvas.width,canvas.height);}catch(e){}}
  canvas.width=w;canvas.height=h;if(saved&&hdCtx){try{hdCtx.putImageData(saved,0,0);}catch(e){}}
  if(!hdCtx){
    hdCtx=canvas.getContext('2d');
    function gp(e){var t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY};}
    function sd(e){e.preventDefault();e.stopPropagation();hdDrawing=true;var p=gp(e);try{hdStrokes.push(hdCtx.getImageData(0,0,canvas.width,canvas.height));}catch(ex){}if(hdStrokes.length>30)hdStrokes.shift();hdCtx.beginPath();hdCtx.moveTo(p.x,p.y);hdCtx.lineCap='round';hdCtx.lineJoin='round';if(hdEraser){hdCtx.globalCompositeOperation='destination-out';hdCtx.lineWidth=hdSz*3;}else{hdCtx.globalCompositeOperation='source-over';hdCtx.strokeStyle=hdCol;hdCtx.lineWidth=hdSz;}}

var unlocker=document.getElementById('unlocker');

// ── 改善版AudioContext管理 ──
// 問題：iOSではAudioContextが停止・クローズされることがある
// 解決：毎回状態を確認し、必要なら再作成する
function getActx(){
  if(!actx||actx.state==='closed'){
    actx=new(window.AudioContext||window.webkitAudioContext)();
    sessionOK=false;
  }
  return actx;
}

function ensureActxRunning(cb){
  var ctx=getActx();
  if(ctx.state==='running'){cb(ctx);return;}
  ctx.resume().then(function(){
    if(ctx.state==='running'){cb(ctx);}
    else{
      // それでも動かない場合は新規作成
      actx=new(window.AudioContext||window.webkitAudioContext)();
      sessionOK=false;
      actx.resume().then(function(){cb(actx);}).catch(function(){cb(actx);});
    }
  }).catch(function(){
    actx=new(window.AudioContext||window.webkitAudioContext)();
    sessionOK=false;
    cb(actx);
  });
}

function unlockSession(cb){
  ensureActxRunning(function(ctx){
    if(sessionOK){cb();return;}
    var p=unlocker.play();
    var done=function(){
      unlocker.pause();unlocker.currentTime=0;
      sessionOK=true;cb();
    };
    if(p){p.then(done).catch(done);}else{done();}
  });
}

// ── 改善版音声再生（ノード解放付き） ──
function playAudioBuffer(decoded, onEnd, onError){
  ensureActxRunning(function(ctx){
    try{
      var gain=ctx.createGain();gain.gain.value=1.0;gain.connect(ctx.destination);
      var src=ctx.createBufferSource();src.buffer=decoded;src.connect(gain);
      src.onended=function(){
        try{src.disconnect();gain.disconnect();}catch(e){}
        if(onEnd)onEnd();
      };
      src.start(0);
      return src;
    }catch(e){
      console.error('playAudioBuffer error:',e);
      // AudioContextをリセットして再試行
      actx=null;sessionOK=false;
      if(onError)onError(e);
    }
  });
}

function openDB(cb){if(idbRef){cb(idbRef);return;}try{var req=indexedDB.open(DB_NAME,DB_VER);req.onupgradeneeded=function(e){e.target.result.createObjectStore(DB_STORE,{keyPath:'name'});};req.onsuccess=function(e){idbRef=e.target.result;idbOK=true;cb(idbRef);};req.onerror=function(e){idbOK=false;cb(null);};req.onblocked=function(){cb(null);};}catch(ex){idbOK=false;cb(null);}}
